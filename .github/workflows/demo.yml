# Publishes the demo (made-up titles, the real app page) to GitHub Pages.
# Needs, once: Settings -> Pages -> Source: GitHub Actions.

name: Demo

on:
  push:
    branches: [main]
    paths: ['worker/src/**', 'worker/scripts/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No npm ci: the demo needs only Node, which runs the TypeScript page
      # module directly.
      - run: node scripts/build-demo.mjs ../_site
        working-directory: worker
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
